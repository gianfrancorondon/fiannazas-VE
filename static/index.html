<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — FinanzasVE</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
          <span class="logo-icon">₿</span>
          <span class="logo-text">FinanzasVE</span>
        </a>
        <a href="/live" style="color:white;text-decoration:none;font-size:14px;font-weight:600;opacity:0.9;">⚡ Herramientas</a>
      </div>
    </header>
    <div class="chat" id="chat"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="message-input" placeholder="Escribe tu pregunta aquí..." rows="1"></textarea>
        <button id="send-btn">➤</button>
      </div>
      <p class="disclaimer">FinanzasVE brinda información general, no asesoría financiera.</p>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>

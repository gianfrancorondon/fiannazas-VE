<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herramientas en vivo — FinanzasVE</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="live-body">
  <div class="live-container">
    <header class="live-header">
      <a href="/" class="back-link">← Volver</a>
      <div class="live-logo">
        <span class="logo-mark">₿</span>
        <span class="logo-name">FinanzasVE</span>
      </div>
      <a href="/chat-page" class="chat-link">💬 Chat</a>
    </header>

    <main class="live-main">
      <section class="rates-section">
        <div class="section-head">
          <h2 class="section-title">💱 Tasas del día</h2>
          <span class="live-badge"><span class="live-dot"></span>EN VIVO</span>
        </div>
        <div id="rates-grid" class="rates-grid">
          <div class="rate-card loading"><p>Cargando tasas…</p></div>
        </div>
        <p class="updated-text" id="updated-text">Actualizando…</p>
      </section>

      <section class="calc-section">
        <h2 class="section-title">🧮 Calculadora</h2>
        <p class="section-sub">Convierte entre bolívares y dólares al instante</p>
        <div class="calc-box">
          <div class="calc-row">
            <label>Bolívares (Bs.)</label>
            <input type="number" id="calc-bs" placeholder="0" step="any" />
          </div>
          <div class="calc-row">
            <label>USD (Paralelo)</label>
            <input type="number" id="calc-usd" placeholder="0" step="any" />
          </div>
          <div class="calc-row">
            <label>USD (BCV oficial)</label>
            <input type="number" id="calc-bcv" placeholder="0" step="any" />
          </div>
        </div>
        <p class="calc-note">Las tasas se actualizan cada 5 minutos. Datos de DolarAPI.com</p>
      </section>
    </main>

    <footer class="live-footer">
      <p>FinanzasVE brinda información general, no asesoría financiera.</p>
    </footer>
  </div>

  <script>
    let currentRates = {};
    let isUpdating = false;

    async function loadRates() {
      try {
        const res = await fetch('/api/rates');
        const data = await res.json();
        currentRates = data;
        renderRates(data);
        document.getElementById('updated-text').textContent =
          'Actualizado: ' + new Date().toLocaleTimeString('es-VE', {hour: '2-digit', minute: '2-digit'});
      } catch (e) {
        document.getElementById('rates-grid').innerHTML =
          '<div class="rate-card error"><p>No se pudieron cargar las tasas.</p></div>';
      }
    }

    function renderRates(rates) {
      const grid = document.getElementById('rates-grid');
      const order = [
        {key: 'paralelo', label: 'Paralelo', emoji: '💵', subtitle: 'Tasa de la calle'},
        {key: 'bcv', label: 'BCV', emoji: '🏦', subtitle: 'Tasa oficial'}
      ];
      let html = '';
      order.forEach(r => {
        if (rates[r.key]) {
          const price = rates[r.key].price.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
          html += '<div class="rate-card"><div class="rate-emoji">' + r.emoji + '</div><div class="rate-label">' + r.label + '</div><div class="rate-price">Bs. ' + price + '</div><div class="rate-sub">' + r.subtitle + '</div></div>';
        }
      });
      grid.innerHTML = html || '<div class="rate-card error"><p>Sin datos disponibles</p></div>';
    }

    function calculate(sourceId, value) {
      if (isUpdating) return;
      isUpdating = true;
      const paralelo = currentRates.paralelo ? currentRates.paralelo.price : 0;
      const bcv = currentRates.bcv ? currentRates.bcv.price : 0;
      let bs = 0;
      if (sourceId === 'calc-bs') bs = value;
      else if (sourceId === 'calc-usd') bs = paralelo ? value * paralelo : 0;
      else if (sourceId === 'calc-bcv') bs = bcv ? value * bcv : 0;
      if (sourceId !== 'calc-bs') document.getElementById('calc-bs').value = bs ? bs.toFixed(2) : '';
      if (sourceId !== 'calc-usd') document.getElementById('calc-usd').value = (bs && paralelo) ? (bs / paralelo).toFixed(2) : '';
      if (sourceId !== 'calc-bcv') document.getElementById('calc-bcv').value = (bs && bcv) ? (bs / bcv).toFixed(2) : '';
      isUpdating = false;
    }

    ['calc-bs', 'calc-usd', 'calc-bcv'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        calculate(id, parseFloat(e.target.value) || 0);
      });
    });

    loadRates();
    setInterval(loadRates, 60000);
  </script>
</body>
</html>
